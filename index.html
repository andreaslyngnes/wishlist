<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Andreas' ønskeliste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0e0f;
    --surface:#151819;
    --surface-hi:#1c2022;
    --text:#ecebe6;
    --muted:#868b86;
    --line:#252a2b;
    --amber:#e8c468;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'DM Sans',system-ui,sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1000px;margin:0 auto;padding:0 24px 96px;}

  /* hero */
  .hero{
    padding:96px 0 64px;
    border-bottom:1px solid var(--line);
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:24px;
    flex-wrap:wrap;
  }
  .eyebrow{
    font-size:12px;
    font-weight:500;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--amber);
    margin-bottom:20px;
  }
  h1{
    font-family:'Instrument Serif',Georgia,serif;
    font-weight:400;
    font-size:clamp(56px,11vw,120px);
    line-height:0.92;
    letter-spacing:-0.02em;
  }
  h1 em{color:var(--amber);}
  .count{
    font-family:'Instrument Serif',Georgia,serif;
    font-size:64px;
    line-height:1;
    color:var(--muted);
  }
  .count small{
    display:block;
    font-family:'DM Sans',sans-serif;
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    margin-top:8px;
  }

  /* sections */
  section{padding-top:56px;}
  .section-head{
    display:flex;
    align-items:baseline;
    gap:14px;
    margin-bottom:24px;
  }
  .section-head h2{
    font-family:'Instrument Serif',Georgia,serif;
    font-weight:400;
    font-size:32px;
  }
  .section-head span{
    font-size:13px;
    color:var(--muted);
  }
  .section-head::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--line);
    align-self:center;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(290px,1fr));
    gap:14px;
  }
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:22px;
    display:flex;
    flex-direction:column;
    min-height:190px;
    color:inherit;
    text-decoration:none;
    transition:background .15s, border-color .15s, transform .15s;
  }
  a.card:hover{
    background:var(--surface-hi);
    border-color:#3a4142;
    transform:translateY(-2px);
  }
  .num{
    font-family:'Instrument Serif',Georgia,serif;
    font-size:15px;
    color:var(--muted);
    margin-bottom:auto;
    padding-bottom:22px;
  }
  .card h3{
    font-size:19px;
    font-weight:600;
    line-height:1.25;
    margin-bottom:6px;
    word-break:break-word;
  }
  .card p{
    font-size:14px;
    color:var(--muted);
    margin-bottom:16px;
  }
  .foot{
    margin-top:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:13px;
  }
  .price{
    font-weight:500;
    background:var(--bg);
    border:1px solid var(--line);
    padding:3px 10px;
    border-radius:99px;
  }
  .go{color:var(--amber);font-weight:500;}
  section.top .card{border-color:#3a3626;}
  section.top .num{color:var(--amber);}

  .msg{padding:80px 0;color:var(--muted);text-align:center;}

  @media (max-width:560px){
    .hero{padding:64px 0 44px;}
    .count{font-size:44px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div>
      <h1>Andreas'<br><em>ønskeliste</em></h1>
    </div>
    <div class="count" id="count"></div>
  </div>

  <div id="content"></div>
  <p class="msg" id="err" hidden>Kunne ikke laste wishlist.json — sjekk at den ligger ved siden av denne siden.</p>
</div>

<script>
const GROUPS = [
  {key:'high',   title:'Mest ønsket',   cls:'top'},
  {key:'normal', title:'Hadde vært fint', cls:''},
  {key:'low',    title:'Småting',  cls:''}
];

const esc = s => {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
};
const attr = s => (s || '').replace(/"/g,'&quot;');

function render(items){
  document.getElementById('count').innerHTML =
    items.length + '<small>ønsker</small>';

  let n = 0;
  const html = GROUPS.map(g=>{
    const list = items.filter(i => (i.priority || 'normal') === g.key);
    if(!list.length) return '';
    const cards = list.map(i=>{
      n++;
      const idx = String(n).padStart(2,'0');
      const inner = `
        <div class="num">${idx}</div>
        <h3>${esc(i.name)}</h3>
        ${i.note ? `<p>${esc(i.note)}</p>` : ''}
        <div class="foot">
          <span>${i.price ? `<span class="price">${esc(i.price)}</span>` : ''}</span>
          ${i.url ? '<span class="go">Se &rarr;</span>' : ''}
        </div>`;
      return i.url
        ? `<a class="card" href="${attr(i.url)}" target="_blank" rel="noopener">${inner}</a>`
        : `<div class="card">${inner}</div>`;
    }).join('');
    return `
      <section class="${g.cls}">
        <div class="section-head"><h2>${g.title}</h2><span>${list.length}</span></div>
        <div class="grid">${cards}</div>
      </section>`;
  }).join('');

  document.getElementById('content').innerHTML =
    html || '<p class="msg">Ingenting på listen akkurat nå.</p>';
}

fetch('wishlist.json')
  .then(r => { if(!r.ok) throw new Error(); return r.json(); })
  .then(render)
  .catch(() => { document.getElementById('err').hidden = false; });
</script>
</body>
</html>
