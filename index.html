<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Andreas' ønskeliste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0e0f;
    --surface:#151819;
    --surface-hi:#1c2022;
    --text:#ecebe6;
    --muted:#868b86;
    --line:#252a2b;
    --amber:#e8c468;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'DM Sans',system-ui,sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1000px;margin:0 auto;padding:0 24px 96px;}

  .hero{
    padding:96px 0 64px;
    border-bottom:1px solid var(--line);
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:24px;
    flex-wrap:wrap;
  }
  h1{
    font-family:'Instrument Serif',Georgia,serif;
    font-weight:400;
    font-size:clamp(56px,11vw,120px);
    line-height:0.92;
    letter-spacing:-0.02em;
  }
  h1 em{color:var(--amber);}
  .count{
    font-family:'Instrument Serif',Georgia,serif;
    font-size:64px;
    line-height:1;
    color:var(--muted);
  }
  .count small{
    display:block;
    font-family:'DM Sans',sans-serif;
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    margin-top:8px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(290px,1fr));
    gap:14px;
    padding-top:56px;
  }
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:22px;
    display:flex;
    flex-direction:column;
    min-height:190px;
    color:inherit;
    text-decoration:none;
    transition:background .15s, border-color .15s, transform .15s;
  }
  a.card:hover{
    background:var(--surface-hi);
    border-color:#3a4142;
    transform:translateY(-2px);
  }
  .num{
    font-family:'Instrument Serif',Georgia,serif;
    font-size:15px;
    color:var(--muted);
    margin-bottom:auto;
    padding-bottom:22px;
  }
  .card h3{
    font-size:19px;
    font-weight:600;
    line-height:1.25;
    margin-bottom:6px;
    word-break:break-word;
  }
  .card > p{
    font-size:14px;
    color:var(--muted);
    margin-bottom:16px;
  }
  .foot{
    margin-top:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:13px;
  }
  .price{
    font-weight:500;
    background:var(--bg);
    border:1px solid var(--line);
    padding:3px 10px;
    border-radius:99px;
    white-space:nowrap;
  }
  .go{color:var(--amber);font-weight:500;white-space:nowrap;}

  /* gruppe med flere alternativer */
  .card.group{grid-column:1/-1;min-height:0;}
  .group .num{margin-bottom:0;padding-bottom:10px;}
  .group-head{
    display:flex;
    align-items:baseline;
    gap:12px;
    margin-bottom:18px;
  }
  .group-head h3{margin:0;font-size:22px;}
  .group-head span{font-size:13px;color:var(--muted);}
  .alts{border-top:1px solid var(--line);}
  .alt{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
    padding:14px 0;
    border-bottom:1px solid var(--line);
    color:inherit;
    text-decoration:none;
  }
  .alt:last-child{border-bottom:0;padding-bottom:0;}
  .alt-main h4{font-size:16px;font-weight:600;line-height:1.3;transition:color .15s;}
  .card .alt-main p{font-size:13px;color:var(--muted);margin:2px 0 0;}
  .alt-side{display:flex;align-items:center;gap:14px;flex-shrink:0;font-size:13px;}
  a.alt:hover h4{color:var(--amber);}

  .msg{padding:80px 0;color:var(--muted);text-align:center;}

  @media (max-width:560px){
    .hero{padding:64px 0 44px;}
    .count{font-size:44px;}
    .alt{align-items:flex-start;flex-direction:column;gap:8px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>Andreas'<br><em>ønskeliste</em></h1>
    <div class="count" id="count"></div>
  </div>

  <div id="content"></div>
  <p class="msg" id="err" hidden>Kunne ikke laste ønskelisten — sjekk at Google Sheets-lenken i index.html er riktig og publisert.</p>
</div>

<script>
// Lim inn lenken fra Google Sheets (Fil → Del → Publiser på nettet → CSV)
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS7D7hCg2UYmJliTj3PkwcwN7F76BtrAbd-l5OqFm3_YX2TBJzJb4AbrjKIJcxfzO3IA4dF4Mt62cPU/pub?gid=488848935&single=true&output=csv';

const esc = s => {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
};
const attr = s => (s || '').replace(/"/g,'&quot;');

function parseCSV(text){
  const rows = [];
  let row = [], cell = '', q = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(q){
      if(c === '"' && text[i+1] === '"'){ cell += '"'; i++; }
      else if(c === '"'){ q = false; }
      else cell += c;
    } else if(c === '"'){ q = true; }
    else if(c === ','){ row.push(cell); cell = ''; }
    else if(c === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
    else if(c !== '\r'){ cell += c; }
  }
  if(cell || row.length){ row.push(cell); rows.push(row); }
  return rows;
}

const ALIASES = {
  group: ['gruppe','group'],
  name:  ['navn','name','ønske'],
  price: ['pris','price'],
  url:   ['lenke','url','link'],
  note:  ['notat','note','kommentar']
};

function toItems(rows){
  const head = rows[0].map(h => h.trim().toLowerCase());
  const col = {};
  for(const k in ALIASES) col[k] = head.findIndex(h => ALIASES[k].includes(h));
  const get = (r, k) => col[k] >= 0 ? (r[col[k]] || '').trim() : '';
  return rows.slice(1).map(r => ({
    group: get(r, 'group'),
    name:  get(r, 'name'),
    price: get(r, 'price'),
    url:   get(r, 'url'),
    note:  get(r, 'note')
  })).filter(i => i.name);
}

// Rader med samme gruppe samles til ett ønske med flere alternativer
function toWishes(items){
  const wishes = [], seen = {};
  items.forEach(i => {
    if(!i.group){ wishes.push({alts:[i]}); return; }
    const k = i.group.toLowerCase();
    if(!seen[k]){ seen[k] = {title:i.group, alts:[]}; wishes.push(seen[k]); }
    seen[k].alts.push(i);
  });
  return wishes;
}

function render(wishes){
  document.getElementById('count').innerHTML = wishes.length + '<small>ønsker</small>';

  const html = wishes.map((w, n) => {
    const idx = String(n + 1).padStart(2, '0');

    if(w.title){
      const alts = w.alts.map(a => {
        const inner = `
          <div class="alt-main">
            <h4>${esc(a.name)}</h4>
            ${a.note ? `<p>${esc(a.note)}</p>` : ''}
          </div>
          <div class="alt-side">
            ${a.price ? `<span class="price">${esc(a.price)}</span>` : ''}
            ${a.url ? '<span class="go">Se &rarr;</span>' : ''}
          </div>`;
        return a.url
          ? `<a class="alt" href="${attr(a.url)}" target="_blank" rel="noopener">${inner}</a>`
          : `<div class="alt">${inner}</div>`;
      }).join('');
      return `
        <div class="card group">
          <div class="num">${idx}</div>
          <div class="group-head"><h3>${esc(w.title)}</h3><span>${w.alts.length} alternativer</span></div>
          <div class="alts">${alts}</div>
        </div>`;
    }

    const i = w.alts[0];
    const inner = `
      <div class="num">${idx}</div>
      <h3>${esc(i.name)}</h3>
      ${i.note ? `<p>${esc(i.note)}</p>` : ''}
      <div class="foot">
        <span>${i.price ? `<span class="price">${esc(i.price)}</span>` : ''}</span>
        ${i.url ? '<span class="go">Se &rarr;</span>' : ''}
      </div>`;
    return i.url
      ? `<a class="card" href="${attr(i.url)}" target="_blank" rel="noopener">${inner}</a>`
      : `<div class="card">${inner}</div>`;
  }).join('');

  document.getElementById('content').innerHTML =
    html ? `<div class="grid">${html}</div>` : '<p class="msg">Ingenting på listen akkurat nå.</p>';
}

fetch(SHEET_URL)
  .then(r => { if(!r.ok) throw new Error(); return r.text(); })
  .then(t => render(toWishes(toItems(parseCSV(t)))))
  .catch(() => { document.getElementById('err').hidden = false; });
</script>
</body>
</html>
